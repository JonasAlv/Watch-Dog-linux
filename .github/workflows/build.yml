name: Build Watch Dog Linux

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WatchDog.dll (.NET 10 / Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Watch-Dog-linux
        uses: actions/checkout@v4
        with:
          path: Watch-Dog-linux

      - name: Checkout BonxieMux (Host Assemblies)
        uses: actions/checkout@v4
        with:
          repository: JonasAlv/BonxieMux
          path: BonxieMux

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build WatchDog.dll
        id: build_dll
        run: |
          cd Watch-Dog-linux
          chmod +x ./build.sh
          ./build.sh
          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" src/WatchDog.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload WatchDog.dll Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchDog-v${{ steps.build_dll.outputs.version }}
          path: Watch-Dog-linux/src/bin/Release/net10.0/WatchDog.dll
